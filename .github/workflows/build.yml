name: Build crDroid 13 OnePlus 12 Kernel
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Kernel variant
        type: choice
        options: [BakaSU-SUSFS, BakaSU, Stock]
        default: BakaSU-SUSFS
      create_release:
        description: Publish successful build as a release
        type: boolean
        default: true
      use_nomount:
        description: "NoMount VFS driver"
        type: boolean
        default: false
      use_bbg:
        description: "Baseband Guard LSM"
        type: boolean
        default: false
      use_net:
        description: "Networking (BBRv3, WireGuard, IPv6 NAT, CIFS)"
        type: boolean
        default: false
      use_ds:
        description: "DroidSpaces container support"
        type: boolean
        default: false
      use_ntsync:
        description: "NTSync"
        type: boolean
        default: false
      use_unicode:
        description: "Experimental Unicode path fix"
        type: boolean
        default: false
      use_bpf:
        description: "BTF + eBPF + FUSE-BPF"
        type: boolean
        default: false
      use_perf:
        description: "Experimental performance patches"
        type: boolean
        default: false
      use_ptrace:
        description: "Ptrace fix (not needed on kernel 6.1)"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: kernel-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      VARIANT: ${{ inputs.variant }}
      USE_NET: ${{ inputs.use_net }}
      USE_DS: ${{ inputs.use_ds }}
      USE_NTSYNC: ${{ inputs.use_ntsync }}
      USE_NOMOUNT: ${{ inputs.use_nomount }}
      USE_BBG: ${{ inputs.use_bbg }}
      USE_BPF: ${{ inputs.use_bpf }}
      USE_UNICODE: ${{ inputs.use_unicode }}
      USE_PERF: ${{ inputs.use_perf }}
      USE_PTRACE: ${{ inputs.use_ptrace }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build machine
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev libdw-dev build-essential lz4 git python3 curl dwarves cpio zip unzip gcc-aarch64-linux-gnu
          sudo fallocate -l 12G /swap-kernel
          sudo chmod 600 /swap-kernel
          sudo mkswap /swap-kernel
          sudo swapon /swap-kernel
      - name: Resolve latest crDroid sources and fetch toolchain
        run: bash scripts/fetch.sh
      - name: Fetch matching official BakaSU managers
        if: inputs.variant != 'Stock'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-managers.py
      - name: Integrate patches and build
        run: |
          mkdir -p artifacts
          set -o pipefail
          bash scripts/build.sh 2>&1 | tee artifacts/build.log
      - name: Package kernel
        run: python3 scripts/package.py
      - name: Upload build output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waffle-crDroid13-${{ inputs.variant }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
  release:
    needs: build
    if: inputs.create_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: waffle-crDroid13-${{ inputs.variant }}-${{ github.run_number }}
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VARIANT: ${{ inputs.variant }}
        run: |
          shopt -s nullglob
          assets=(artifacts/*.zip artifacts/*.apk artifacts/*.json)
          gh release create "build-${GITHUB_RUN_NUMBER}" "${assets[@]}" \
            --target "${GITHUB_SHA}" \
            --title "waffle crDroid 13 ${VARIANT} #${GITHUB_RUN_NUMBER}" \
            --notes "Latest crDroid 17.0 sources; actual commits and driver version are in build-info.json. Included official normal and Spoofed managers match the BakaSU driver commit (except Stock builds). Compilation success is not device boot validation. Disable existing SUSFS LKM before using built-in SUSFS."
